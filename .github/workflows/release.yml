# Release: pushing a tag v<OMC_VERSION> publishes the source. Releases carry no binaries: users build omc on their own
# machine (install.sh does it for them). The job builds and tests the tagged commit, packs it with `make dist`
# (git archive), checks that the archive alone builds, and attaches it with SHA256SUMS to a GitHub release.
# Supply chain: no third-party actions. Checkout is plain git; publishing uses the gh CLI that GitHub's runners
# ship with; build-tools/ci.sh installs nothing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out (git only)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Tag matches the version
        run: build-tools/ci.sh tag-check "$TAG"
      - name: Dependencies
        run: build-tools/ci.sh check-deps
      - name: Build (zero warnings)
        run: build-tools/ci.sh build
      - name: Tests
        run: build-tools/ci.sh test
      - name: Source archive (built once more from the archive alone)
        run: build-tools/ci.sh dist
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          build-tools/release_notes.sh "$(make -s version)" > notes.md
          gh release create "$TAG" --draft --verify-tag --title "omc $TAG" --notes-file notes.md \
            build/dist/omc-*.tar.gz build/dist/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
