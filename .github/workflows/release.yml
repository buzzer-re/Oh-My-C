# Release: pushing a tag v<OMC_VERSION> publishes a GitHub release with a prebuilt binary per platform (Linux x86_64,
# Linux arm64, macOS arm64, and Windows x86_64 as a zip with omc.exe and libomc.dll) and the source archive, with
# SHA256SUMS over all of them. install.sh / install.ps1 install the binary; `install.sh --build` builds the source
# archive instead. The release stays a draft until every asset is uploaded.
# Supply chain: no third-party actions. Checkout is plain git; publishing uses the gh CLI that GitHub's runners ship
# with; build-tools/ci.sh installs nothing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out (git only)
        run: &checkout |
          git init -q .
          git config core.autocrlf false # Windows runners default to CRLF checkouts
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Tag matches the version
        run: build-tools/ci.sh tag-check "$TAG"
      - name: Draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; delete it (and re-push the tag) to publish again" >&2
            exit 1
          fi
          build-tools/release_notes.sh "$(make -s version)" > notes.md
          gh release create "$TAG" --draft --verify-tag --title "omc $TAG" --notes-file notes.md

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false # every platform reports; publish still needs all of them
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2025 # Git Bash runs the steps; MinGW-w64 gcc, make and Python ship with the image
    steps:
      - name: Check out (git only)
        run: *checkout
      - name: Dependencies
        run: build-tools/ci.sh check-deps
      - name: Build (zero warnings)
        run: build-tools/ci.sh build
      - name: Smoke
        run: build-tools/ci.sh smoke
      - name: Tests
        run: build-tools/ci.sh test
      - name: Package the binary
        run: build-tools/ci.sh dist
      - name: Upload to the draft release
        run: gh release upload "$TAG" $(build-tools/ci.sh dist-assets)

  source:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out (git only)
        run: *checkout
      - name: Source archive (built once more from the archive alone)
        run: build-tools/ci.sh dist-src
      - name: Upload to the draft release
        run: |
          v=$(make -s version)
          gh release upload "$TAG" "build/dist/omc-$v.tar.gz" "build/dist/omc-$v.tar.gz.sha256"

  publish:
    needs: [build, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checksums and publish
        run: |
          mkdir sums && cd sums
          gh release download "$TAG" --pattern '*.sha256'
          cat ./*.sha256 | sed 's/ [*]/  /' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
