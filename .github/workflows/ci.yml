# Build and test every push to main and every pull request.
# Supply chain: no third-party actions at all. The code is checked out with plain git and every step runs
# build-tools/ci.sh, which installs nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: macos-arm64
            runner: macos-15
    steps:
      - name: Check out (git only)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Dependencies
        run: build-tools/ci.sh check-deps
      - name: Build (zero warnings)
        run: build-tools/ci.sh build
      - name: Smoke
        run: build-tools/ci.sh smoke
      - name: Tests
        run: build-tools/ci.sh test
